<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Endurance Extrême</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 80%;
            max-width: 1200px;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        header, footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .content {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        .main, .sidebar {
            padding: 20px;
            background: #eaeaea;
            min-height: 300px;
        }
        .main {
            width: 65%;
        }
        .sidebar {
            width: 30%;
        }
        .newsletter {
            background: #ddd;
            padding: 20px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
        }
        button {
            background: #333;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Endurance Extrême - Wireframe</h1>
        </header>
        
        <div class="content">
            <section class="main">
                <h2>Article Principal</h2>
                <p>Zone dédiée à la présentation du produit phare.</p>
            </section>
            
            <aside class="sidebar">
                <h2>Informations Supplémentaires</h2>
                <p>Zone réservée aux promotions, témoignages clients, ou éléments graphiques.</p>
            </aside>
        </div>
        
        <div class="newsletter">
            <h2>Inscription à la Newsletter</h2>
            <form action="#" method="post">
                <input type="text" name="prenom" placeholder="Prénom" required>
                <input type="text" name="nom" placeholder="Nom" required>
                <input type="email" name="email" placeholder="Adresse e-mail" required>
                <button type="submit">S'inscrire</button>
            </form>
        </div>
        
        <footer>
            <p>© 2024 Endurance Extrême - Tous droits réservés</p>
        </footer>
    </div>
</body>
</html>
